name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit signatures
      - run: npm run scan:secrets
      - run: npm run check:alerts
      - run: npm run check:container
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test
      - run: npm run test:load
      - run: npm run test:restore
      - run: npm run benchmark:phase5
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  browser:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx supabase start
      - name: Configure browser Supabase fixture
        shell: bash
        run: |
          status="$(npx supabase status -o env)"
          value() {
            printf '%s\n' "$status" | awk -F= -v key="$1" '$1 == key { sub(/^"/, "", $2); sub(/"$/, "", $2); print $2; exit }'
          }
          {
            echo "SUPABASE_URL=$(value API_URL)"
            echo "SUPABASE_PUBLISHABLE_KEY=$(value PUBLISHABLE_KEY)"
            echo "SUPABASE_SECRET_KEY=$(value SECRET_KEY)"
            echo "SUPABASE_RESUME_BUCKET=resumes"
            echo "OPENAI_API_KEY=ci-openai-key"
          } >> "$GITHUB_ENV"
      - run: npx supabase db reset --local
      - run: npm run test:e2e
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  database:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx supabase start
      - run: npm run test:db

  container:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag resumide:${{ github.sha }} .
      - name: Scan production image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: resumide:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
